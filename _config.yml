    project_description: Built, initially as sole developer, the framework for an undisclosed gameplay feature, then used it to deliver four pieces of content in the main story mission line as the team grew to five. Worked in constant collaboration with art, code (AI, gameplay, graphics) and UI teams. Feature details are under NDA.
