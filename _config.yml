# Projects (Featured Work cards). See README.md for how to edit.
show_author_project_details: true
author_project_details:
  - project_title: Grand Theft Auto VI
    project_info: Rockstar North · 2022 – present · Senior Game System Engineer
    project_description: "I created the four in-game console and arcade games in GTA VI: Tenebrae Lux, Street Trash 3: Dezombifier, Time Jackers: Rewind and Bang for your Buck. I built, initially as sole developer, a common framework as the base for all of them, and developed the gameplay systems that shape each game as the team grew to five."
    project_url: https://www.youtube.com/watch?v=QdBZY2fkU-0
    youtube_id: QdBZY2fkU-0
    project_caption: Official trailer © Rockstar Games.
    visibility: true

  - project_title: Tenebrae Lux
    project_info: Rockstar North · Grand Theft Auto VI · Senior Game System Engineer
    project_description: A black-and-white first-person puzzle game on the JoySystem in GTA VI, set on an island as you work your way to a lighthouse. I developed the gameplay systems for Tenebrae Lux, using the common framework I built as the base for all four in-game games.
    project_url: https://www.youtube.com/watch?v=adiQtS-5wOk
    youtube_id: adiQtS-5wOk
    project_quote: while simultaneously providing a few excellent hours of puzzling.
    project_quote_source: Kotaku
    project_quote_url: https://kotaku.com/gta-6s-tenebrae-lux-is-a-hilarious-parody-of-video-game-auteurs-and-a-surprisingly-good-puzzle-diversion-2000758837
    project_caption: Gameplay footage by BeardBear
    visibility: true

  - project_title: "Street Trash 3: Dezombifier"
    project_info: Rockstar North · Grand Theft Auto VI · Senior Game System Engineer
    project_description: "A top-down zombie shooter on the JoySystem in GTA VI: you fight through the streets, pick perk cards as you level up, and try to extract before the clock runs out. I developed the gameplay systems that shape Street Trash 3, using the common framework I built as the base for all four in-game games."
    project_url: https://www.youtube.com/watch?v=Ut9zC6kxLrA
    youtube_id: Ut9zC6kxLrA
    project_quote: It is ludicrous that something as meaty and polished as Street Trash 3 exists inside another video game
    project_quote_source: IGN
    project_quote_url: https://www.ign.com/articles/forget-the-lighthouse-gta-6s-best-minigame-is-a-full-blown-zombie-shooter-that-will-take-you-hours-to-beat
    project_caption: Gameplay footage by LeGi0N21
    visibility: true

  - project_title: "Time Jackers: Rewind"
    project_info: Rockstar North · Grand Theft Auto VI · Senior Game System Engineer
    project_description: "A top-down sci-fi shooter on the JoySystem in GTA VI, where Captain Jack Hoffman uses a time-slowing chrono-power to reach each level's exit before the timer runs out. I developed the gameplay systems for Time Jackers: Rewind, using the common framework I built as the base for all four in-game games."
    project_url: https://www.youtube.com/watch?v=7ou4OOgtW20
    youtube_id: 7ou4OOgtW20
    project_quote: "Time Jackers is somewhat similar to Street Trash III given its top-down isometric perspective. But it's more action-oriented–less evading enemies and more shooting them dead."
    project_quote_source: GameSpot
    project_quote_url: https://www.gamespot.com/articles/all-joysystem-video-games-in-gta-6/
    project_caption: Gameplay footage by Kirito
    visibility: true

  - project_title: Bang for your Buck
    project_info: Rockstar North · Grand Theft Auto VI · Senior Game System Engineer
    project_description: "A first-person hunting arcade game in GTA VI, played on cabinets around Leonida: you shoot bucks for cash, leave the does alone, and unlock more hunting grounds. I developed the gameplay systems for Bang for your Buck, using the common framework I built as the base for all four in-game games."
    project_url: https://www.youtube.com/watch?v=hkimUMlg-l8
    youtube_id: hkimUMlg-l8
    project_quote: Bang For Your Buck is an on-rails first-person shooter (akin to Time Crisis and others in the genre).
    project_quote_source: GameSpot
    project_quote_url: https://www.gamespot.com/articles/all-joysystem-video-games-in-gta-6/
    project_caption: Gameplay footage by TNAG
    visibility: true

  - project_title: GTA Online
    project_info: Rockstar North · 2018 – 2021 · Online Mission Script Designer
    project_description: As part of an ~8-person online team, scripted mission content for every major update from Southern San Andreas Super Sport Series (2018) to The Contract (2021). Built heist preparation missions, parachute jump challenges, driving modes for the Los Santos Tuners car meet, and playable arcade cabinet games for The Diamond Casino Heist.
