# Author details
author: Alex Catalán
author_headline: Senior Game System Engineer
author_headline_sub: Content Frameworks · Systems Design · Mission Scripting
author_pitch: Nearly nine years at Rockstar North building gameplay systems, mission content and camera features for GTA VI, GTA Online, Red Dead Redemption 2 and Red Dead Online.
author_bio: I'm a Senior Game System Engineer at Rockstar North. I design and script gameplay systems, mission content and camera features in RAGE Script and C#, from GTA Online heist content to main-story content for GTA VI. I hold a Computer Science degree and a Master's in video game creation from Universitat Pompeu Fabra.
