# Author details
author: Alex Catalán
author_headline: Senior Game System Engineer
author_headline_sub: Content Frameworks · Systems Design · Mission Scripting
author_pitch: Nine years at Rockstar North building content and features for GTA VI, GTA Online, Red Dead Redemption 2 and Red Dead Online.
author_bio: I'm a Senior Game System Engineer at Rockstar North. I design and script gameplay systems, mission content and other features in RAGE Script and C#, from GTA Online heist content to the in-game console and arcade games in GTA VI. I hold a Computer Science degree and a Master's in video game creation from Universitat Pompeu Fabra.
